plugins:
  - rubocop-rspec

require:
  - ./rubocop/pgbus

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # The docs site (docs/) is a self-contained nested Rails app with its own
    # .rubocop.yml (docs-kit's shipped cops + rubocop-rails-omakase). It lints
    # itself in its own CI job; the gem's cops (and the local ./lib/rubocop/pgbus
    # require) don't apply to it.
    #
    # BOTH patterns are required. `docs/**/*` excludes the files from inspection,
    # but RuboCop's target finder still DESCENDS into docs/ and loads
    # docs/.rubocop.yml — which `require`s gems (docs_kit/rubocop, rubocop-rake via
    # rubocop-rails-omakase) that aren't in the gem's bundle, crashing the whole
    # run before a single file is inspected (green locally only if those gems
    # happen to be installed globally). The bare `docs` entry prunes the directory
    # from traversal so its config is never read. See PR #269 / issue #266.
    - "docs"
    - "docs/**/*"

# Custom cop: Timeout.timeout uses Thread#raise and can corrupt a pooled
# connection mid-call. Banned everywhere; no autocorrect. The one deliberate
# last-resort use in lib/pgbus/client.rb is annotated with rubocop:disable.
Pgbus/NoRubyTimeout:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
  Exclude:
    # bin/labels is the zoolutions labels kit, byte-identical across repos; see docs-kit LABELS_KIT.md
    - bin/labels

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Metrics:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - vt
    - id
    - n
    - m
    - io

Layout/LineLength:
  Max: 140

RSpec/ExampleLength:
  Max: 20
  Exclude:
    # Integration specs orchestrate multi-phase scenarios (connect → broadcast
    # → disconnect → reconnect → assert) that legitimately need more than
    # 20 lines to express clearly.
    - spec/integration/**/*

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 4

RSpec/LeakyConstantDeclaration:
  Enabled: false

RSpec/IdenticalEqualityAssertion:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/integration/**/*
    - spec/i18n_spec.rb
    - spec/pgbus/integrations/appsignal/dashboard_spec.rb
    - spec/pgbus/pg_connect_guard_spec.rb

RSpec/AnyInstance:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/InstanceVariable:
  Exclude:
    - spec/system/**/*
    # Integration specs use @saved_* instance vars to snapshot and restore
    # global Pgbus configuration between suites — the idiomatic rspec
    # alternative (shared_context with around hooks) is much more verbose
    # for the same semantics.
    - spec/integration/**/*
    # Request specs share @stub_data_source, set by a before(:each) hook in
    # spec/support/pgbus/request_spec_setup.rb — same idiom as system specs.
    - spec/requests/**/*

RSpec/BeforeAfterAll:
  Exclude:
    # Integration tests legitimately need before(:all) for expensive setup
    # like booting Puma or flipping Pgbus.configuration — running it
    # per-example would triple the suite runtime.
    - spec/integration/**/*

Naming/PredicateMethod:
  Exclude:
    - spec/**/*

Lint/UnusedMethodArgument:
  Exclude:
    - spec/system/support/**/*
    # The shared StubDataSource mirrors Web::DataSource's keyword signatures
    # (minutes:, page:, per_page:) that controllers pass through, even where
    # the in-memory stub ignores them.
    - spec/support/pgbus/stub_data_source.rb
