# conformance-kit's Tier 1 gate: the rubocop-thread_safety cops
# (zoolutions/phlex-reactive#363, #527). Fix first, no baseline: a ThreadSafety
# disable is inline only, with the reason it is safe next to it.
inherit_gem:
  conformance-kit: config/rubocop.yml

plugins:
  - rubocop-rspec

require:
  - ./rubocop/pgbus

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # The docs site (docs/) is a self-contained nested Rails app with its own
    # .rubocop.yml (docs-kit's shipped cops + rubocop-rails-omakase). It lints
    # itself in its own CI job; the gem's cops (and the local ./lib/rubocop/pgbus
    # require) don't apply to it.
    #
    # BOTH patterns are required. `docs/**/*` excludes the files from inspection,
    # but RuboCop's target finder still DESCENDS into docs/ and loads
    # docs/.rubocop.yml — which `require`s gems (docs_kit/rubocop, rubocop-rake via
    # rubocop-rails-omakase) that aren't in the gem's bundle, crashing the whole
    # run before a single file is inspected (green locally only if those gems
    # happen to be installed globally). The bare `docs` entry prunes the directory
    # from traversal so its config is never read. See PR #269 / issue #266.
    - "docs"
    - "docs/**/*"

# Custom cop: Timeout.timeout uses Thread#raise and can corrupt a pooled
# connection mid-call. Banned everywhere; no autocorrect. The one deliberate
# last-resort use in lib/pgbus/client.rb is annotated with rubocop:disable.
Pgbus/NoRubyTimeout:
  Enabled: true

# Custom cop: every dashboard timestamp, age and duration goes through
# Pgbus::Web::TimeFormat and its view helpers (issue #497). ERB is guarded by
# spec/pgbus/web/time_conventions_spec.rb instead (RuboCop cannot parse it).
Pgbus/DashboardTimeFormatting:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "lib/pgbus/web/**/*.rb"
  Exclude:
    - "lib/pgbus/web/time_format.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
  Exclude:
    # bin/labels is the zoolutions labels kit, byte-identical across repos; see docs-kit LABELS_KIT.md
    - bin/labels

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Metrics:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - vt
    - id
    - n
    - m
    - io

Layout/LineLength:
  Max: 140

RSpec/ExampleLength:
  Max: 20
  Exclude:
    # Integration specs orchestrate multi-phase scenarios (connect → broadcast
    # → disconnect → reconnect → assert) that legitimately need more than
    # 20 lines to express clearly.
    - spec/integration/**/*

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 4

RSpec/LeakyConstantDeclaration:
  Enabled: false

RSpec/IdenticalEqualityAssertion:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/integration/**/*
    - spec/i18n_spec.rb
    - spec/pgbus/integrations/appsignal/dashboard_spec.rb
    - spec/pgbus/pg_connect_guard_spec.rb

RSpec/AnyInstance:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/InstanceVariable:
  Exclude:
    - spec/system/**/*
    # Integration specs use @saved_* instance vars to snapshot and restore
    # global Pgbus configuration between suites — the idiomatic rspec
    # alternative (shared_context with around hooks) is much more verbose
    # for the same semantics.
    - spec/integration/**/*
    # Request specs share @stub_data_source, set by a before(:each) hook in
    # spec/support/pgbus/request_spec_setup.rb — same idiom as system specs.
    - spec/requests/**/*

RSpec/BeforeAfterAll:
  Exclude:
    # Integration tests legitimately need before(:all) for expensive setup
    # like booting Puma or flipping Pgbus.configuration — running it
    # per-example would triple the suite runtime.
    - spec/integration/**/*

Naming/PredicateMethod:
  Exclude:
    - spec/**/*

Lint/UnusedMethodArgument:
  Exclude:
    - spec/system/support/**/*
    # The shared StubDataSource mirrors Web::DataSource's keyword signatures
    # (minutes:, page:, per_page:) that controllers pass through, even where
    # the in-memory stub ignores them.
    - spec/support/pgbus/stub_data_source.rb

# Specs and their harnesses start threads on purpose: to race the code under
# test, to stand in for the listener/pump/heartbeat threads, or to boot a real
# Puma/Falcon server. Listed file by file (never a directory), so a new spec
# that starts a thread is a deliberate addition here.
ThreadSafety/NewThread:
  Exclude:
    - spec/integration/concurrency_block_durability_spec.rb
    - spec/integration/concurrency_spec.rb
    - spec/integration/connection_failure_spec.rb
    - spec/integration/deploy_tasks_spec.rb
    - spec/integration/fair_share_read_spec.rb
    - spec/integration/job_uniqueness_spec.rb
    - spec/integration/read_ahead_spec.rb
    - spec/integration/recurring_scheduler_uniqueness_spec.rb
    - spec/integration/streams_pool_autoscale_spec.rb
    - spec/integration/streams_pool_publisher_autoscale_spec.rb
    - spec/integration/streams_pool_swap_spec.rb
    - spec/integration/streams/harness_smoke_spec.rb
    - spec/integration/streams/presence_adapter_lock_spec.rb
    - spec/integration/thread_safety_spec.rb
    - spec/integration/workflow/support.rb
    - spec/pgbus/batch/builder_spec.rb
    - spec/pgbus/boot_memo_spec.rb
    - spec/pgbus/client_pool_trigger_spec.rb
    - spec/pgbus/client_spec.rb
    - spec/pgbus/client_swap_spec.rb
    - spec/pgbus/client/connection_health_spec.rb
    - spec/pgbus/client/new_features_spec.rb
    - spec/pgbus/client/resizable_pool_spec.rb
    - spec/pgbus/dedup_cache_spec.rb
    - spec/pgbus/execution_pools/async_pool_reactor_spec.rb
    - spec/pgbus/metrics/backends/prometheus_spec.rb
    - spec/pgbus/process/consumer_read_ahead_spec.rb
    - spec/pgbus/process/consumer_spec.rb
    - spec/pgbus/process/memory_usage_spec.rb
    - spec/pgbus/process/notify_listener_spec.rb
    - spec/pgbus/process/wake_signal_spec.rb
    - spec/pgbus/process/worker_read_ahead_spec.rb
    - spec/pgbus/process/worker_spec.rb
    - spec/pgbus/stream_queue_spec.rb
    - spec/pgbus/streams/filters_spec.rb
    - spec/pgbus/streams/pool_trigger_spec.rb
    - spec/pgbus/streams/presence_adapter_lock_spec.rb
    - spec/pgbus/streams/transaction_probe_spec.rb
    - spec/pgbus/testing_mode_spec.rb
    - spec/pgbus/visibility_heartbeat_mutex_spec.rb
    - spec/pgbus/web/streamer/connection_spec.rb
    - spec/pgbus/web/streamer/hub_client_spec.rb
    - spec/pgbus/web/streamer/hub_protocol_spec.rb
    - spec/pgbus/web/streamer/instance_spec.rb
    - spec/pgbus/web/streamer/io_writer_spec.rb
    - spec/pgbus/web/streamer/listener_spec.rb
    - spec/pgbus/web/streamer/master_hub_boot_spec.rb
    - spec/pgbus/web/streamer/master_hub_spec.rb
    - spec/pgbus/web/streamer/peer_close_watcher_spec.rb
    - spec/pgbus/web/streamer/registry_spec.rb
    - spec/pgbus/web/streamer/stream_counter_spec.rb
    - spec/support/falcon_test_harness.rb
    - spec/support/first_call_race.rb
    - spec/support/puma_test_harness.rb
    - spec/support/sse_test_client.rb
