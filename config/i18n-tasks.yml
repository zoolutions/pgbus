---
# i18n-tasks configuration for Pgbus engine
# https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en, da, de, es, fi, fr, it, ja, nb, nl, pt, sv]

data:
  router: pattern_router
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/*.%{locale}.yml
  write:
    - config/locales/%{locale}.yml
  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
  exclude:
    - "*.md"
    - app/assets/images
    - app/frontend/pgbus/vendor
  strict: false

translation:
  backend: openai
  openai_api_key: <%= ENV["OPENAI_API_KEY"] %>
  openai_model: gpt-4.1-mini

ignore_missing:
  - "activerecord.*"

ignore_unused:
  - "pgbus.helpers.*"
  - "pgbus.insights.show.time_ranges.*"
  - "pgbus.dashboard.queue_health.words.*"
  - "pgbus.insights.show.charts.series_name"
  - "pgbus.recurring_tasks.index.task_count.*"
  - "pgbus.deploy_tasks.banner.lagging_html.*"
  - "pgbus.deploy_tasks.reasons.waiting_lagging_html.*"
  - "pgbus.processes.state.activity.schedule.*"
  - "pgbus.processes.state.activity.slots.*"
  - "pgbus.processes.state.activity.threads.*"
  - "pgbus.processes.state.kinds.*"
  # Workflows (issue #542): plural forms reached through a dynamic key.
  - "pgbus.workflows.attention.confirm.*"
  - "pgbus.workflows.flash.bulk_resume.*"
  - "pgbus.workflows.flash.bulk_cancel.*"
  # Plural forms reached through the dynamic summary.<key> lookup (issue #491).
  - "pgbus.queues.show.summary.drained_by_html.*"
  - "pgbus.queues.show.summary.drained_wildcard_html.*"
  - "pgbus.queues.show.summary.drained_live_html.*"
  - "pgbus.queues.show.summary.no_workers_html.*"
  - "pgbus.queues.show.summary.no_consumers_html.*"
