# The label taxonomy for zoolutions/pgbus — the single source of truth.
#
# `bin/labels sync` makes GitHub match this file; `bin/labels validate` checks it
# offline. The rules live in .github/LABELS.md.
#
# Every label outside the `area` group, and the shared `devops`/`dx`/`docs-site`
# areas, come from docs-kit's labels kit (LABELS_KIT.md) and must stay identical
# to docs-kit's copy (`script/labels-kit check`). The other areas are this repo's.
---
ignore: []

labels:
  # ---------------------------------------------------------------- type ----
  # Exactly one per issue/PR: what kind of work this is.
  - name: bug
    color: d73a4a
    description: Something isn't working
    group: type
  - name: enhancement
    color: a2eeef
    description: New feature or request
    group: type
  - name: performance
    color: fbca04
    description: Faster or leaner with no change in behaviour
    group: type
  - name: tech-debt
    color: 9c27bb
    description: Refactoring or cleanup that pays down an accepted shortcut
    group: type
  - name: security
    color: "e9e257"
    description: Vulnerability, hardening, or an authorization correctness fix
    group: type
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
    group: type
  - name: dependencies
    color: d93f0b
    description: Changes dependencies in some way
    group: type
  - name: chore
    color: ededed
    description: CI, tooling or configuration work with no behaviour change
    group: type

  # ---------------------------------------------------------------- area ----
  # One or more per issue/PR: which part of the code it touches. Shared first.
  - name: devops
    color: 006b75
    description: CI, the release kit, Docker, deploys and infrastructure
    group: area
  - name: dx
    color: 16a085
    description: Developer experience — agent commands and rules, generators, local tooling
    group: area
  - name: docs-site
    color: 2ea44f
    description: The documentation site under docs/
    group: area
  # pgbus's own areas.
  - name: streaming
    color: 1d76db
    description: Streams — broadcasting rendered updates over PGMQ
    group: area
  - name: client
    color: 0366d6
    description: The PGMQ client, queues and the PGMQ schema
    group: area
  - name: connections
    color: 7eafec
    description: Database connections, pooling and connection safety
    group: area
  - name: process
    color: 5b8def
    description: Worker processes, the dispatcher, executors and supervision
    group: area
  - name: jobs
    color: 3e6abd
    description: The ActiveJob adapter, batches, concurrency, uniqueness, recurring jobs and retries
    group: area
  - name: event-bus
    color: 1f6feb
    description: The event bus, events and the outbox
    group: area
  - name: dashboard
    color: 0e8a16
    description: The web dashboard
    group: area
  - name: observability
    color: 42b204
    description: Metrics, instrumentation, logging and error reporting
    group: area
  - name: mcp
    color: 1abc9c
    description: The MCP server
    group: area
  - name: cli
    color: 6fbf73
    description: The CLI, doctor and table maintenance tasks
    group: area
  - name: generators
    color: 017cf4
    description: Install and migration generators
    group: area
  - name: testing
    color: 0052cc
    description: The test helpers shipped to host apps
    group: area
  - name: stability
    color: "300e84"
    description: Crash safety, recovery and resilience under failure (applied by judgment)
    group: area
  - name: core
    color: 5319a0
    description: Configuration, the Rails engine and serialization
    group: area

  # -------------------------------------------------------------- status ----
  # Where an issue is in its lifecycle. Never on a pull request.
  - name: plan
    color: 6f42c1
    description: Has a /plan body with Context, Decision, Steps and Gates; ready for /lfg
    group: status
  - name: epic
    color: "5319e7"
    description: Umbrella item tracking several smaller issues
    group: status
  - name: blocker
    color: 8a63d2
    description: Blocks other work or a release until it is resolved
    group: status
  - name: needs-info
    color: d4c5f9
    description: Waiting on details before it can be planned or worked on
    group: status

  # ----------------------------------------------------------- community ----
  # GitHub's defaults, kept because GitHub surfaces them to contributors.
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
    group: community
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
    group: community
  - name: question
    color: d876e3
    description: Further information is requested
    group: community
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
    group: community
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
    group: community
  - name: wontfix
    color: ffffff
    description: This will not be worked on
    group: community

# Path globs -> area label, used by `bin/labels infer` and by /plan and /lfg to
# label deterministically from a diff. Matched with File.fnmatch and
# File::FNM_PATHNAME | File::FNM_EXTGLOB: write a recursive glob as `**/*`. A
# path may match several globs — every matching area applies.
paths:
  "lib/pgbus/streams.rb": streaming
  "lib/pgbus/streams/**/*": streaming
  "lib/tasks/pgbus_streams.rake": streaming
  "lib/pgbus/{client,pgmq_schema,queue_factory,queue_name_validator}.rb": client
  "lib/pgbus/{client,pgmq_schema}/**/*": client
  "lib/pgbus/{client,pgmq_schema}.rb": client
  "lib/tasks/pgbus_{pgmq,queues}.rake": client
  "lib/pgbus/{dedicated_connection,bus_record,database_tasks_guard}.rb": connections
  "lib/pgbus/process/**/*": process
  "lib/pgbus/execution_pools/**/*": process
  "lib/pgbus/execution_pools.rb": process
  "lib/pgbus/{execution_pools,visibility_heartbeat,circuit_breaker,fair_share,health_probe}.rb": process
  "lib/puma/**/*": process
  "lib/pgbus/{active_job,batch,concurrency,recurring}/**/*": jobs
  "lib/pgbus/{active_job,batch,concurrency,recurring}.rb": jobs
  "lib/pgbus/{batch,concurrency,uniqueness,retry_backoff,dedup_cache}.rb": jobs
  "lib/pgbus/event_bus/**/*": event-bus
  "lib/pgbus/outbox/**/*": event-bus
  "lib/pgbus/outbox.rb": event-bus
  "lib/pgbus/{event,outbox,failed_event_recorder}.rb": event-bus
  "app/**/*": dashboard
  "lib/pgbus/web/**/*": dashboard
  "config/routes.rb": dashboard
  "config/locales/**/*": dashboard
  "lib/pgbus/metrics/**/*": observability
  "lib/pgbus/metrics.rb": observability
  "lib/pgbus/{metrics,instrumentation,log_formatter,error_reporter,stat_buffer,rate_counter}.rb": observability
  "lib/pgbus/mcp.rb": mcp
  "lib/pgbus/mcp/**/*": mcp
  "lib/pgbus/cli/**/*": cli
  "lib/pgbus/cli.rb": cli
  "lib/pgbus/{cli,doctor,autovacuum_tuning,table_maintenance}.rb": cli
  "lib/tasks/pgbus_{doctor,autovacuum}.rake": cli
  "exe/**/*": cli
  "lib/generators/**/*": generators
  "lib/pgbus/generators/**/*": generators
  "spec/generators/**/*": generators
  "spec/{requests,system}/**/*": dashboard
  "lib/pgbus/testing.rb": testing
  "lib/pgbus/testing/**/*": testing
  "lib/pgbus.rb": core
  "lib/pgbus/{configuration,engine,current_attributes,serializer,support}.rb": core
  "lib/pgbus/configuration/**/*": core
  "lib/pgbus/configuration.rb": core
  "spec/pgbus/streams_spec.rb": streaming
  "spec/pgbus/streams/**/*": streaming
  "spec/pgbus/{client,pgmq_schema,queue_factory,queue_name_validator}_spec.rb": client
  "spec/pgbus/{client,pgmq_schema}/**/*": client
  "spec/pgbus/{client,pgmq_schema}_spec.rb": client
  "spec/pgbus/{dedicated_connection,bus_record,database_tasks_guard}_spec.rb": connections
  "spec/pgbus/process/**/*": process
  "spec/pgbus/execution_pools/**/*": process
  "spec/pgbus/execution_pools_spec.rb": process
  "spec/pgbus/{execution_pools,visibility_heartbeat,circuit_breaker,fair_share,health_probe}_spec.rb": process
  "spec/pgbus/{active_job,batch,concurrency,recurring}/**/*": jobs
  "spec/pgbus/{active_job,batch,concurrency,recurring}_spec.rb": jobs
  "spec/pgbus/{batch,concurrency,uniqueness,retry_backoff,dedup_cache}_spec.rb": jobs
  "spec/pgbus/event_bus/**/*": event-bus
  "spec/pgbus/outbox/**/*": event-bus
  "spec/pgbus/outbox_spec.rb": event-bus
  "spec/pgbus/{event,outbox,failed_event_recorder}_spec.rb": event-bus
  "spec/pgbus/web/**/*": dashboard
  "spec/pgbus/metrics/**/*": observability
  "spec/pgbus/{metrics,instrumentation,log_formatter,error_reporter,stat_buffer,rate_counter}_spec.rb": observability
  "spec/pgbus/mcp/**/*": mcp
  "spec/pgbus/cli_spec.rb": cli
  "spec/pgbus/{cli,doctor,autovacuum_tuning,table_maintenance}_spec.rb": cli
  "spec/pgbus/generators/**/*": generators
  "spec/pgbus/testing_spec.rb": testing
  "spec/pgbus/testing/**/*": testing
  "spec/pgbus_spec.rb": core
  "spec/pgbus/{configuration,engine,current_attributes,serializer,support}_spec.rb": core
  "spec/pgbus/configuration/**/*": core
  "spec/pgbus/configuration_spec.rb": core
  ".github/**/*": devops
  "bin/release": devops
  "rakelib/**/*": devops
  "**/Dockerfile*": devops
  ".claude/**/*": dx
  "{AGENTS,CLAUDE}.md": dx
  "bin/labels": dx
  "docs/**/*": docs-site
