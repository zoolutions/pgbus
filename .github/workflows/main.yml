name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-26.04
    name: Security
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Scan for dependency vulnerabilities
        run: bundle exec bundle-audit check --update

  lint:
    runs-on: ubuntu-26.04
    name: Lint
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: RuboCop
        # Lint the gem's own source explicitly rather than a bare `rubocop` that
        # auto-discovers the tree. The docs site (docs/) is a self-contained
        # nested Rails app with its own bundle and .rubocop.yml (inheriting
        # rubocop-rails-omakase + docs_kit/rubocop). RuboCop's target finder loads
        # a directory's .rubocop.yml while scanning it — before AllCops/Exclude
        # applies — so a bare run at the repo root loads docs/.rubocop.yml and
        # crashes on gems absent from the gem's bundle (rubocop-rake, docs_kit).
        # docs/ lints itself in the Docs site workflow.
        run: bundle exec rubocop app benchmarks config gemfiles lib spec Gemfile Rakefile pgbus.gemspec
      - name: Herb (HTML+ERB linter)
        run: bun run lint:herb
      - name: Verify gem builds
        run: bundle exec rake build

  # Exercise the gemspec's required_ruby_version floor (>= 3.3.0) beyond rspec:
  # rubocop + `rake build` on the oldest supported Ruby so we catch syntax or
  # gem-build regressions that only surface on 3.3. The full lint job (bun/herb,
  # Ruby-version-independent) stays on 3.4; this leg is deliberately narrow.
  # See issue #284.
  lint_floor:
    runs-on: ubuntu-26.04
    name: Lint (Ruby 3.3 floor)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop app benchmarks config gemfiles lib spec Gemfile Rakefile pgbus.gemspec
      - name: Verify gem builds
        run: bundle exec rake build

  bench:
    runs-on: ubuntu-26.04
    name: Benchmarks (report only)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Unit benchmarks
        continue-on-error: true
        run: bundle exec rake bench:all
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks
          path: tmp/benchmarks/*.txt
          if-no-files-found: warn

  test:
    runs-on: ubuntu-26.04
    name: Ruby ${{ matrix.ruby }} (Rails ${{ matrix.rails }})
    strategy:
      fail-fast: false
      # Prove the gemspec's `railties >= 7.1, < 9.0` support claim at BOTH
      # endpoints, not just the top (see issue #284). The default legs run the
      # main Gemfile (latest 8.x) across every supported Ruby. The `include`
      # legs pin the 7.1 lower bound via BUNDLE_GEMFILE=gemfiles/rails_7_1.gemfile
      # on the Ruby floor (3.3) and ceiling (4.0) — endpoints only, no full cube.
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
        gemfile:
          - "Gemfile"
        rails:
          - "8.x"
        include:
          - ruby: "3.3"
            gemfile: "gemfiles/rails_7_1.gemfile"
            rails: "7.1"
          - ruby: "4.0"
            gemfile: "gemfiles/rails_7_1.gemfile"
            rails: "7.1"

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # bundler-cache keys on BUNDLE_GEMFILE (set above), so the main and
          # 7.1 legs get separate caches keyed on their own lockfiles.
          bundler-cache: true
      # Every DB- and browser-free spec set runs here, so request specs exercise
      # the controllers on each Ruby × Rails leg. spec/pgbus/ci_coverage_spec.rb fails
      # when a spec file outside spec/dummy and spec/support is not run by any job.
      - name: Run unit tests
        run: >-
          bundle exec rspec spec/pgbus/ spec/generators/ spec/requests/
          spec/rubocop/ spec/benchmarks/
          spec/i18n_spec.rb spec/pgbus_spec.rb
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}
          path: coverage/
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-26.04
    name: Integration (PG ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - "17"
          - "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: pgbus
          POSTGRES_PASSWORD: pgbus
          POSTGRES_DB: pgbus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGBUS_DATABASE_URL: postgres://pgbus:pgbus@localhost:5432/pgbus_test

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Set up PGMQ schema
        run: |
          PGPASSWORD=pgbus psql -h localhost -U pgbus -d pgbus_test -c "CREATE SCHEMA IF NOT EXISTS pgmq"
          bundle exec ruby -e "
            require 'pg'
            require 'pgbus'
            Pgbus.configure { |c| c.database_url = ENV['PGBUS_DATABASE_URL'] }
            conn = PG.connect(ENV['PGBUS_DATABASE_URL'])
            conn.exec(Pgbus::PgmqSchema.install_sql)
            conn.exec(Pgbus::PgmqSchema.version_tracking_sql)
            conn.close
          "
      - name: Set up pgbus tables
        run: |
          bundle exec ruby -e "
            require 'pg'
            conn = PG.connect(ENV['PGBUS_DATABASE_URL'])
            # Create all pgbus tables
            conn.exec(<<~SQL)
              CREATE TABLE IF NOT EXISTS pgbus_processed_events (
                id BIGSERIAL PRIMARY KEY,
                event_id VARCHAR NOT NULL,
                handler_class VARCHAR NOT NULL,
                processed_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE UNIQUE INDEX IF NOT EXISTS idx_pgbus_processed_events_unique
                ON pgbus_processed_events (event_id, handler_class);

              CREATE TABLE IF NOT EXISTS pgbus_processes (
                id BIGSERIAL PRIMARY KEY,
                kind VARCHAR NOT NULL,
                hostname VARCHAR,
                pid INTEGER,
                metadata JSONB DEFAULT '{}',
                last_heartbeat_at TIMESTAMP,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS pgbus_semaphores (
                id BIGSERIAL PRIMARY KEY,
                key VARCHAR NOT NULL,
                value INTEGER NOT NULL DEFAULT 0,
                max_value INTEGER NOT NULL DEFAULT 1,
                expires_at TIMESTAMP NOT NULL,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE UNIQUE INDEX IF NOT EXISTS idx_pgbus_semaphores_key
                ON pgbus_semaphores (key);

              CREATE TABLE IF NOT EXISTS pgbus_blocked_executions (
                id BIGSERIAL PRIMARY KEY,
                concurrency_key VARCHAR NOT NULL,
                queue_name VARCHAR NOT NULL,
                payload JSONB NOT NULL,
                priority INTEGER NOT NULL DEFAULT 0,
                expires_at TIMESTAMP NOT NULL,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS pgbus_job_locks (
                id BIGSERIAL PRIMARY KEY,
                lock_key VARCHAR NOT NULL,
                job_class VARCHAR NOT NULL,
                job_id VARCHAR,
                state VARCHAR NOT NULL DEFAULT 'queued',
                owner_pid INTEGER,
                owner_hostname VARCHAR,
                locked_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                expires_at TIMESTAMP NOT NULL
              );
              CREATE UNIQUE INDEX IF NOT EXISTS idx_pgbus_job_locks_key
                ON pgbus_job_locks (lock_key);
              CREATE INDEX IF NOT EXISTS idx_pgbus_job_locks_expires
                ON pgbus_job_locks (expires_at);
              CREATE INDEX IF NOT EXISTS idx_pgbus_job_locks_reaper
                ON pgbus_job_locks (state, owner_pid);

              CREATE TABLE IF NOT EXISTS pgbus_recurring_executions (
                id BIGSERIAL PRIMARY KEY,
                task_key VARCHAR NOT NULL,
                run_at TIMESTAMP NOT NULL,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE UNIQUE INDEX IF NOT EXISTS idx_pgbus_recurring_executions_dedup
                ON pgbus_recurring_executions (task_key, run_at);
              CREATE INDEX IF NOT EXISTS idx_pgbus_recurring_executions_cleanup
                ON pgbus_recurring_executions (run_at);

              CREATE TABLE IF NOT EXISTS pgbus_failed_events (
                id BIGSERIAL PRIMARY KEY,
                queue_name VARCHAR NOT NULL,
                msg_id BIGINT,
                payload JSONB,
                headers JSONB,
                error_class VARCHAR,
                error_message TEXT,
                backtrace TEXT,
                retry_count INTEGER DEFAULT 0,
                failed_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX IF NOT EXISTS idx_pgbus_failed_events_queue
                ON pgbus_failed_events (queue_name);
              CREATE INDEX IF NOT EXISTS idx_pgbus_failed_events_time
                ON pgbus_failed_events (failed_at);
              CREATE UNIQUE INDEX IF NOT EXISTS idx_pgbus_failed_events_queue_msg
                ON pgbus_failed_events (queue_name, msg_id);
            SQL
            conn.close
          "
      - name: Run integration tests
        run: bundle exec rspec spec/integration/

  system_test:
    runs-on: ubuntu-26.04
    name: System Tests
    env:
      RAILS_ENV: test
      HEADLESS: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      # Playwright 1.58 has no ubuntu26.04 build mapping and refuses to
      # install; the 24.04 Chromium build runs on 26.04. Without this every
      # bun.lock change (a Playwright cache miss) breaks the job.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bunx --bun playwright install chromium

      - name: Install Playwright system dependencies
        timeout-minutes: 3
        run: sudo bunx --bun playwright install-deps chromium 2>/dev/null || true

      - name: Run system tests
        run: bundle exec rspec spec/system/

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots
          path: tmp/capybara/**/*.png
          if-no-files-found: ignore
